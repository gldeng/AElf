syntax = "proto3";

import "aelf/core.proto";
import "aelf/options.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
// The namespace of this class
option csharp_namespace = "AElf.Contracts.ZkWasmGame";

service ZkWasmGame {
  // The name of the state class the smart contract is going to use to access blockchain state
  option (aelf.csharp_state) = "AElf.Contracts.ZkWasmGame.ZkWasmGameState";

  // Actions (methods that modify contract state)
  // Stores the value in contract state
  rpc SubmitGame (SubmitGameInput) returns (google.protobuf.Empty) {
  }

  rpc SetVerifier (aelf.Address) returns (google.protobuf.Empty) {
  }

  // Views
  rpc GetVerifier(google.protobuf.Empty) returns (aelf.Address) {
    option (aelf.is_view) = true;
  }
  rpc GetGameState(google.protobuf.Empty) returns (GameState) {
    option (aelf.is_view) = true;
  }
}

message GameState {
  string total_steps = 1;
  string current_position = 2;
}

message SubmitGameInput {
  repeated string proof = 1;
  repeated string verifyInstance = 2;
  repeated string aux = 3;
  repeated StringArray targetInstance = 4;
  message StringArray {
    repeated string value = 1;
  }
}